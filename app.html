<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GordaoMod — Plataforma DEMO</title>
<meta name="description" content="Plataforma de recursos FiveM — ambiente demonstrativo.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://gordaomod.expostacker.com.br/app">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main" class="skip-link">Pular para conteudo</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegacao lateral">
    <div class="sidebar-logo">GordaoMod</div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-demo-badge">AMBIENTE DEMO</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <div class="topbar-right">
        <div class="search-box" id="searchBox" role="button" tabindex="0" aria-label="Buscar">
          <span>Buscar...</span>
          <kbd>Ctrl K</kbd>
        </div>
        <button class="icon-btn" id="notifBtn" aria-label="Notificacoes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge-dot"></span>
        </button>
        <div class="user-chip">
          <div class="avatar">A</div>
          <span style="font-size:13px;color:var(--text-secondary)">Admin DEMO</span>
        </div>
      </div>
    </header>

    <main id="main" class="content" role="main"></main>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" aria-label="Painel lateral"></aside>

<div class="cmd-overlay" id="cmdOverlay" role="dialog" aria-label="Busca rapida">
  <div class="cmd-box">
    <input type="text" class="cmd-input" id="cmdInput" placeholder="Buscar recursos, categorias, colecoes, docs..." aria-label="Buscar">
    <div class="cmd-results" id="cmdResults"></div>
  </div>
</div>

<div class="notif-panel" id="notifPanel" aria-label="Notificacoes"></div>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
